# 同一个提交只跑一遍（优化分析 NE3，用户 2026-11-08 定的；以前 v1.24.0–v1.26.2 每个提交 feature、main、tag 各跑一遍）：
# - push feature/**（和手动 Run workflow）：完整跑 —— 编译、全部测试、打包和打包后的检查，DMG 传成 artifact，留 14 天，
#   够跨过「feature 绿 → 合 main → 打 tag」。
# - push main：check job 先查这个提交在这个 workflow 里有没有绿过的 push run（任何分支都算）：绿过就整个跳过；没绿过
#   （比如直接往 main 推了没测过的提交）照旧完整跑。
# - push v* tag：绿过、而且那次的 DMG 还在 → 不重编、不重测，restamp job 下载那份 DMG、版本号换成 tag 的（feature 上打的
#   包版本号是 0.1，见 build_app.sh）、重签，release job 照旧发 Release（附 release-notes/<tag>.md）；没绿过 / 产物过期了
#   → 照旧完整跑再发。
# 发版流程：feature 推上去等绿 → 合进 main 推上去（秒过）→ 打 tag（直接用 feature 那次的包）。
name: Release

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  workflow_dispatch: {}

# 默认只读;release job 拿 contents: write，check、restamp 拿 actions: read（查 run、下载别的 run 的产物），见下。
permissions:
  contents: read

env:
  # 固定 Xcode:macos-15 runner 镜像当前默认就是 16.4 (16F6),显式钉住是为了
  # 镜像换默认 (26.x 已装在旁边) 时不会悄悄换编译器 —— Metrics.swift 的表达式
  # 拆分等 CI 适配都是针对 Xcode 16 做的。升级时改这一行并重新跑 main 看绿。
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  # 这次 run 干什么（Scripts/ci_green_run.py）：mode = full（完整跑）/ skip（推 main、绿过了）/ reuse（推 tag、沿用
  # run_id 那一次的 DMG）。查不了（网络、权限、限流）一律 full；脚本退出码总是 0。摘要页上有一条 notice 说为什么。
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.green.outputs.mode }}
      run_id: ${{ steps.green.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: culling-poc/LabelGUI/Scripts/ci_green_run.py
          sparse-checkout-cone-mode: false
      # 查的是 checkout 出来的提交（rev-parse HEAD）：带注解的 tag 也落到提交本身，和 API 的 head_sha 对得上。
      - name: 这个提交绿过没有
        id: green
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I culling-poc/LabelGUI/Scripts/ci_green_run.py --sha "$(git rev-parse HEAD)"

  build:
    needs: check
    # mode 没写上（check 自己红了）也当 full：宁可多跑一遍，不能不测。
    if: ${{ !cancelled() && needs.check.outputs.mode != 'skip' && needs.check.outputs.mode != 'reuse' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # build_app.sh 用 git rev-list --count 生成 CFBundleVersion,浅克隆会数成 1。
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Swift 版本 (进缓存键)
        id: swift
        run: echo "version=$(swift --version 2>&1 | head -1 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      # LabelGUI 目前没有外部包 (Package.resolved 不存在,hashFiles 对缺失文件给空串),
      # 缓存的是增量编译产物;键里带 Package.swift 和 swift 版本,换编译器就作废。
      - name: 缓存 SwiftPM 构建
        uses: actions/cache@v4
        with:
          path: culling-poc/LabelGUI/.build
          key: swiftpm-${{ runner.os }}-${{ steps.swift.outputs.version }}-${{ hashFiles('culling-poc/LabelGUI/Package.resolved', 'culling-poc/LabelGUI/Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ steps.swift.outputs.version }}-

      # 从这一步到「卸下 DMG」是打包和打包后的检查（构建、DMG 本身、包里的二进制 / 胶片表 / Python 运行时）；再往后是拿
      # 裸二进制跑的测试。推 tag 沿用 feature 那次的 DMG 时，这些检查不再跑（restamp 只改版本号、重签、验签名）。
      # tee 一份 build.log 给下一步出 annotation。pipefail 要自己开：GitHub 默认的 shell 是 bash -e、不带 pipefail，
      # 管道的退出码是 tee 的 —— 不开的话 build_app.sh 失败这一步照样绿。
      - name: 构建 app + DMG
        id: build
        run: |
          set -o pipefail
          ./build_app.sh 2>&1 | tee build.log

      # 不登录也看得到（NE2：匿名拿不到 job 日志，以前编译警告、失败原因、各阶段用时在摘要页上都看不见）：编译警告去重转成
      # ::warning（链到文件和行；一步最多 10 条，全部列在摘要里），构建红了另把前几个编译错误和 build.log 末尾 60 行写成
      # ::error。各阶段用时 build_app.sh 退出时自己打 ::notice，这里抄进摘要。构建成功、失败都跑。
      - name: 构建日志 → annotation
        if: always() && steps.build.outcome != 'skipped'
        run: python3 -I culling-poc/LabelGUI/Scripts/ci_build_annotations.py build.log ${{ steps.build.outcome == 'failure' && '--failed' || '' }}

      # 发出去的就是这个 DMG（NE6）：挂上（只读、不进访达、不自动开窗口），里面那份 app 验签名（--deep --strict），下面几步
      # 打包后的检查都用挂载点里的二进制（$APP_BIN）跑。以前用仓库根目录下的 选片工具.app：DMG 本身能不能挂上、里面那份全不全、
      # 签名对不对都没人验。卸下在「卸下 DMG」那一步（前面红了也卸）。
      - name: 挂上 DMG、验签名
        run: |
          MNT="$RUNNER_TEMP/dmg"
          mkdir -p "$MNT"
          hdiutil attach 选片工具.dmg -nobrowse -readonly -noautoopen -mountpoint "$MNT"
          echo "DMG_MNT=$MNT" >> "$GITHUB_ENV"
          APP="$MNT/选片工具.app"
          if [ ! -x "$APP/Contents/MacOS/LabelGUI" ]; then
            echo "::error title=DMG::挂上以后没有 选片工具.app/Contents/MacOS/LabelGUI"
            ls -la "$MNT"
            exit 1
          fi
          if [ "$(readlink "$MNT/Applications")" != /Applications ]; then
            echo "::error title=DMG::没有指向 /Applications 的替身（拖进去安装用的）"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "APP_BIN=$APP/Contents/MacOS/LabelGUI" >> "$GITHUB_ENV"

      # 判决层回归：Fixtures/photot-session 的分析结果灌进临时目录跑 --verdicts，和期望
      # 逐字比对。改了分组/判决/提名逻辑而没更新期望值 → 这里红。
      - name: 判决回归 (--verdicts)
        run: culling-poc/LabelGUI/Scripts/verdict_regression.sh culling-poc/LabelGUI/.build/release/LabelGUI

      # MCP 冒烟（v1）：协议 + 没有 app + 不建目录 + 无界面；不需要照片，不起宿主。
      # mcp_smoke 只在 CI 上跑的「不设 LABELGUI_DATA_DIR 也不建目录」那一条要求 runner 上还没有默认数据目录
      # ~/Library/Application Support/选片工具：哪一步先建出它，这一条就只能 skip。所以放得靠前（前面的构建、判决回归都不建它），
      # 往它前面加会起 LabelGUI 的步骤时记着这一条。
      # 第二行是 DMG 里那份 app 的二进制（$APP_BIN，「挂上 DMG」那一步设的）：脚本只在 --ci 且 GITHUB_ACTIONS=true 时收它，
      # 不跑 sandbox 那一组（规则抓到就 SIGKILL）。
      - name: MCP 冒烟 (--mcp)
        timeout-minutes: 10
        run: |
          python3 -I culling-poc/LabelGUI/Scripts/mcp_smoke.py culling-poc/LabelGUI/.build/release/LabelGUI --ci
          python3 -I culling-poc/LabelGUI/Scripts/mcp_smoke.py "$APP_BIN" --ci --protocol-only

      # 装进 app 的胶片表（Resources/film-luts）：裸二进制往上找到的是仓库里的表，测不出漏装 —— v1.24.0–v1.26.1 漏了
      # 每款的 .json，颗粒、晕光、冲印区在发出去的 app 里都不起作用。这里用 DMG 里那份 app 的二进制跑：在 .app 里只读
      # Contents/Resources/film-luts、不往上找（CollageFilmLUTs.foundDirectory），包里漏了哪张表这里就红（负片缺 _e 表 =
      # 胶片曝光不起作用，也查）。DMG 挂在仓库外面（$RUNNER_TEMP），往上也找不到仓库，两道保险。
      - name: 打包后的胶片表 (--film-looks-selftest)
        timeout-minutes: 5
        run: |
          D=$(mktemp -d)
          mkdir -p "$D/data" "$D/sock" "$D/mcp"
          LABELGUI_DATA_DIR="$D/data" LABELGUI_NO_GUI=1 LABELGUI_LIVE_SOCK_ROOT="$D/sock" LABELGUI_MCP_OUT="$D/mcp" \
            "$APP_BIN" --film-looks-selftest

      # 包里的 Python 运行时（NE5）：VLM 那一段在用户机器上跑的就是 Contents/Resources/culling-poc（app 每次启动同步到数据目录的
      # runtime/culling-poc，在那里 uv run python layer2.py），CI 以前从来没跑过它 —— 和 v1.26.2 以前漏 .json 是同一类。
      # 照 app 的做法拷到仓库外面再跑（仓库里往上找得到开发用的 pyproject，包里漏了文件也测不出）：--locked 要求包里的 uv.lock
      # 和 pyproject 对得上；--help 走一遍顶层的 import（requests、tqdm、common）；pillow 在 layer2.py 里用到才 import，另起一次，
      # 带 --offline（装过一次以后不联网也起得来）。包里不带 uv、Python、依赖：用户第一次跑 VLM 要联网（uv 下 CPython 3.12 和
      # 三个包），这里 runner 联网。
      - name: 包里的 Python 运行时 (layer2.py)
        timeout-minutes: 10
        run: |
          R="$RUNNER_TEMP/runtime/culling-poc"
          rm -rf "$R"
          mkdir -p "$(dirname "$R")"
          cp -R "$DMG_MNT/选片工具.app/Contents/Resources/culling-poc" "$R"
          cd "$R"
          test -f prompts/judge_prompt.txt || { echo "::error title=包里的 Python 运行时::没有 prompts/judge_prompt.txt"; exit 1; }
          uv run --locked python layer2.py --help
          uv run --locked --offline python -c "import PIL, requests, tqdm; from PIL import Image; print('pillow', PIL.__version__, 'requests', requests.__version__, 'tqdm', tqdm.__version__)"

      - name: 卸下 DMG
        if: always() && env.DMG_MNT != ''
        run: hdiutil detach "$DMG_MNT" || hdiutil detach "$DMG_MNT" -force

      # 推 tag 沿用这次的 DMG 时 restamp job 要走的路，这里拿一份副本、假版本号预演一遍（上传的 DMG 不动）：tag 那次才第一次
      # 跑到的步骤（拷出来、改版本号、重签、重新建卷、只读挂上核对），feature 上就先验过。
      - name: 预演 restamp（假版本号）
        timeout-minutes: 10
        run: |
          culling-poc/LabelGUI/Scripts/restamp_dmg.sh 选片工具.dmg 0.0.0 "$RUNNER_TEMP/restamp-dryrun.dmg"
          rm -f "$RUNNER_TEMP/restamp-dryrun.dmg"

      # 实时桥（v1）：起 --live-host（.prohibited，窗口从不显示；不行就 --no-view），经 --mcp 驱动；临时数据目录 + 测试 socket 根目录。
      # 带不带视图：第一次分支 CI（run 41158761483，2026-10-30）探针报「CI 用带视图的 --live-host」，所以钉 --view require ——
      # 以后哪次 runner 上建不了离屏窗口、拍不出快照或标题栏，这一步就红，不会悄悄退到 --no-view 少测 15 条。
      # 每条 FAIL 在摘要页另有一条 ::error:: annotation（不登录也看得到）。
      - name: 实时桥冒烟 (--live-host)
        timeout-minutes: 25
        run: python3 -I culling-poc/LabelGUI/Scripts/live_smoke.py culling-poc/LabelGUI/.build/release/LabelGUI --ci --view require

      # 存储卡导入回归：随机字节造一张假卡跑 --ingest 的各种情况 —— 卡上文件前后逐字节不变、目标里
      # 绝不覆盖（同名不同内容整组改名）、复制后校验、取消不留半截、再插只导新的。
      - name: 存储卡导入回归 (--ingest)
        env:
          CARD_REGRESSION_EXFAT: "1"
        run: python3 culling-poc/LabelGUI/Scripts/card_import_regression.py culling-poc/LabelGUI/.build/release/LabelGUI

      # 不要照片的进程内自检：网格改判后的焦点、时间轴不出界、五种杂志风和人物挡字的版式规则、场次持久化、选片 MCP、
      # 文件安全、拼图导出、确认表……每条都在新的临时 LABELGUI_DATA_DIR 里跑（要 fixture 的传 Fixtures/photot-session）；
      # 时间轴自检的随机数按 seed 播种，固定跑 3 个 seed（三批互不相同的 3000 组；FAIL 行带 seed 和 trial，原样能复现）。最后核对「CI 登记」：
      # 自检登记表（SelfTestRegistry.swift，selftests.sh 用 --list-selftests 拿）里每一条都有人跑、Sources 里没有绕过登记表的
      # --*-selftest、Scripts/ 下每个 *_regression.py / *_smoke.py 在这个文件里都有一步。跑哪些、带什么参数也从登记表来。
      # 和下面几步一样放在 MCP 冒烟后面（见 MCP 冒烟那段注释）。
      - name: 自检 (--*-selftest)
        # 每条自检在 selftests.sh 里单独限时 300 秒（卡住的点名报错、后面照跑）；runner 是虚拟机，Vision 比本机慢得多，整步给足
        timeout-minutes: 30
        run: culling-poc/LabelGUI/Scripts/selftests.sh culling-poc/LabelGUI/.build/release/LabelGUI

      # 合成图跑原生分析：手写几张结果确定的图（平滑渐变、整张死白、截断的 .jpg、带动态照片尾巴的、手写 APP1 拍摄时间 +
      # Orientation=6 的连拍对）真跑 --analyze，再 --verdicts --per-photo，按正则断言理由和标志（虚焦、曝光裁切不判过曝、
      # 文件损坏、同组、预览转正），不比数值；最后给 2000 / 8000 行的 --verdicts 计时（很宽的上限 + 耗时比）。临时数据目录。
      - name: 合成图跑原生分析 (--analyze)
        timeout-minutes: 15
        run: python3 -I culling-poc/LabelGUI/Scripts/native_analysis_smoke.py culling-poc/LabelGUI/.build/release/LabelGUI

      # 交付回归（端到端，纯函数那一半是上面「自检」里的 --delivery-selftest）：水印输出路径就是原片（同路径 / 大小写 / 硬链接）
      # 被拒、原片不变；水印批量输出到拍摄文件夹里面（照片目录本身、里面还没建的子目录、--session 那一场里面）退出码 1、
      # 一个文件不多，导进「水印导出/」照常、再导一次全是 -2；写 XMP 时 LR 的 sidecar 只改星级色标、调色关键字按字段不变，
      # 自己的整份重写，读不全 / 读不了的不碰；精华 Top N 和水印去 GPS（对照组 GPS 还在）。合成图、临时数据目录。
      - name: 交付回归 (--export-xmp / --export-jpeg / --watermark)
        timeout-minutes: 10
        run: python3 -I culling-poc/LabelGUI/Scripts/delivery_regression.py culling-poc/LabelGUI/.build/release/LabelGUI

      # 无头护栏（审查 S13、S36）：会写数据目录的命令不设 LABELGUI_DATA_DIR、或者指到真实数据目录（原样 / 符号链接 / 大小写 /
      # 结尾斜杠）都退出码 2、什么都不写；batch.* 钉在内存里，跑完 LabelGUI 设置域逐字节不变；GUI 启动门控对一个真的
      # --live-host --no-view 探锁认人（--launch-gate-probe，只打印不弹框）；main.swift 顶层分派和 AppRuntime.commandFlags 两边对得上、
      # 自检只登在登记表里（--list-selftests）、两处按表分派都在建数据目录 / 开界面之前。
      # 「真实数据目录」用 CFFIXED_USER_HOME 换成假的家目录下那个，但 A 段 --session-key 不设 LABELGUI_DATA_DIR、E 段用真的
      # 家目录比 defaults export：必须放在 MCP 冒烟后面（见那段注释），万一假家目录失灵也不会抢先建出默认数据目录。
      - name: 无头护栏回归 (数据目录闸 / 启动门控)
        timeout-minutes: 10
        run: python3 -I culling-poc/LabelGUI/Scripts/cli_guard_regression.py culling-poc/LabelGUI/.build/release/LabelGUI

      # 照片 id 稳定：后加 / 移走同名文件、两个子文件夹同名、这一次解不开的那张，没动过的照片 id 不变、改判和客户选中还对得上
      # （sips 合成小图真跑 --analyze）。工作目录用脚本默认的 culling-poc/LabelGUI/.build 底下：经过符号链接的临时目录里带路径的
      # id 会多带一段（脚本 H 组专门测那种），前几组要的是平常路径；脚本出异常也在 finally 里删，不会进上面的 SwiftPM 缓存。
      - name: 照片 id 稳定回归 (--analyze)
        timeout-minutes: 10
        run: python3 -I culling-poc/LabelGUI/Scripts/photo_id_regression.py culling-poc/LabelGUI/.build/release/LabelGUI

      # 交付对照：导出 JPG / 精华 Top N / 水印写出去的文件名记进这一场的 exports.json，「导入客户选择」按交付文件名
      # （01_DSCF7208、DSCF7207_wm、20260321_002）认回原片，重名、不在这一场的照实列出、不猜。合成图 + Fixtures/photot-session。
      - name: 交付对照回归 (exports.json / --client-import)
        timeout-minutes: 10
        run: python3 -I culling-poc/LabelGUI/Scripts/delivery_ledger_regression.py culling-poc/LabelGUI/.build/release/LabelGUI

      # 选片确认表端到端：套餐张数、每张备注读回来、精修要求.csv（BOM、转义、改了另存 -2）、可选水印不动预览文件。
      # Fixtures/photot-session 的分析结果 + 现造的图，不要真照片。
      - name: 选片确认表回归 (--proof-sheet / --client-import / --copy-originals)
        timeout-minutes: 10
        run: python3 -I culling-poc/LabelGUI/Scripts/proof_sheet_regression.py culling-poc/LabelGUI/.build/release/LabelGUI

      # 诊断端到端（进程内那一半是「自检」里的 --diag-selftest）：--diag-export 的包里没有照片、客户原话、bookmark、家目录；
      # chmod 000 的照片文件夹分析说「没有权限」并点名隐私设置；写 XMP / 导出 JPG 写不进时说原因、一个文件不多写。
      - name: 诊断回归 (--diag-export / 没权限)
        timeout-minutes: 10
        run: python3 -I culling-poc/LabelGUI/Scripts/diag_regression.py culling-poc/LabelGUI/.build/release/LabelGUI

      # 留 14 天：推 tag 时沿用的就是它（check 只认没过期的）。
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCulling-dmg
          path: 选片工具.dmg
          if-no-files-found: error
          retention-days: 14

  # 推 tag、这个提交绿过：拿那一次的 DMG，只把版本号换成 tag 的（feature / main 上打的包 CFBundleShortVersionString 是
  # 0.1：build_app.sh 只从 tag 带版本号；它会出现在「关于」、诊断包、MCP 的 serverInfo 里）。CFBundleVersion 是提交数，
  # 同一个提交本来就一样。只改 Info.plist、重签（和 build_app.sh 同一句 codesign），代码段、色调表、Python 运行时和那次
  # 测过的一样；访达排版（.DS_Store、背景图）跟着 DMG 原样留着。传成这次 run 的 PhotoCulling-dmg，release 照旧下载。
  # 这一步红了不会自动退回完整跑：重跑这个 run，或者在网页上对这个 tag 手动 Run workflow（手动跑一律完整跑，照样发 Release）。
  restamp:
    needs: check
    if: needs.check.outputs.mode == 'reuse'
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
    steps:
      # 只取那个脚本。要在下载产物之前：checkout 会清空工作目录，放后面会把 DMG 删掉。
      - uses: actions/checkout@v4
        with:
          sparse-checkout: culling-poc/LabelGUI/Scripts/restamp_dmg.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: PhotoCulling-dmg
          run-id: ${{ needs.check.outputs.run_id }}
          github-token: ${{ github.token }}

      # 拷出来改、重新建卷（原卷几乎没有空余，原地重签会 ENOSPC），最后只读挂上核对版本号和签名 —— 见脚本开头。
      # build job 的「预演 restamp」每次都用同一个脚本跑过一遍。
      - name: 版本号换成 tag 的、重签
        env:
          FROM_RUN: ${{ needs.check.outputs.run_id }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          MSG="$(culling-poc/LabelGUI/Scripts/restamp_dmg.sh 选片工具.dmg "$V" "$RUNNER_TEMP/restamped.dmg" | tail -1)"
          mv -f "$RUNNER_TEMP/restamped.dmg" 选片工具.dmg
          ls -lh 选片工具.dmg
          echo "::notice title=沿用 run ${FROM_RUN} 的安装包::${MSG%%；*}；那次编译、测过的包原样发"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCulling-dmg
          path: 选片工具.dmg
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # 只认 tag。DMG 从这次 run 里下载：完整跑的是 build 传的，沿用的是 restamp 传的（两个只会跑一个）。build 跳过时 release
  # 默认也会跟着跳过，所以要 !cancelled()。
  release:
    needs: [check, build, restamp]
    if: ${{ !cancelled() && github.ref_type == 'tag' && (needs.build.result == 'success' || needs.restamp.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 只取 release-notes/（发布说明）。要在下载产物之前：checkout 会清空工作目录，放后面会把 DMG 删掉。
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release-notes

      - uses: actions/download-artifact@v4
        with:
          name: PhotoCulling-dmg

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 资产名必须 ASCII — GitHub 会把非 ASCII 字符从文件名里剥掉
          # (选片工具-v1.1.2.dmg 上传后变成 -v1.1.2.dmg)。
          cp 选片工具.dmg "PhotoCulling-${GITHUB_REF_NAME}.dmg"
          # 发布说明：有 release-notes/<tag>.md 就放在正文最前面（这一版新增 / 修改了什么），
          # 后面接 GitHub 自动生成的提交对比；没有就只有自动生成的。
          NOTES="release-notes/${GITHUB_REF_NAME}.md"
          NOTES_ARGS=()
          if [ -f "$NOTES" ]; then NOTES_ARGS=(--notes-file "$NOTES"); fi
          # Release 已存在就只补/换资产（有说明文件就顺手换正文）：半途失败后点 "Re-run jobs" 时
          # gh release create 会以 422 already_exists 再次失败。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "PhotoCulling-${GITHUB_REF_NAME}.dmg" --clobber
            if [ -f "$NOTES" ]; then gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES"; fi
          else
            gh release create "$GITHUB_REF_NAME" "PhotoCulling-${GITHUB_REF_NAME}.dmg" \
              --title "选片工具 $GITHUB_REF_NAME" \
              "${NOTES_ARGS[@]}" \
              --generate-notes
          fi
