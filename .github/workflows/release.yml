# push 到 main → 只构建验证 (CI 先测试);推 v* tag → 构建并自动创建
# Release 附上 DMG。发版流程:先推 main 等 CI 绿,再打 tag。
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: 构建 app + DMG
        run: ./build_app.sh

      - name: 发布 Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 资产名必须 ASCII — GitHub 会把非 ASCII 字符从文件名里剥掉
          # (选片工具-v1.1.2.dmg 上传后变成 -v1.1.2.dmg)。
          cp 选片工具.dmg "PhotoCulling-${GITHUB_REF_NAME}.dmg"
          gh release create "$GITHUB_REF_NAME" "PhotoCulling-${GITHUB_REF_NAME}.dmg" \
            --title "选片工具 $GITHUB_REF_NAME" \
            --generate-notes

      - name: 上传构建产物 (手动触发时)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: 选片工具-dmg
          path: 选片工具.dmg
